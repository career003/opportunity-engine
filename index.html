<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Engine India - Daily Jobs & Scholarships</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-8 px-4 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Opportunity Engine India</h1>
        <p class="mt-2 text-blue-100 text-sm md:text-base">Automated Daily Jobs, Scholarships, Internships & Free Courses</p>
        
        <!-- Search Bar -->
        <div class="mt-6 max-w-xl mx-auto">
            <input type="text" id="searchInput" placeholder="Search titles, keywords, or categories..." 
                class="w-full px-4 py-3 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm"
                onkeyup="filterOpportunities()">
        </div>
    </header>

    <!-- Category Filters -->
    <nav class="max-w-6xl mx-auto px-4 mt-6 flex flex-wrap gap-2 justify-center" id="categoryFilters">
        <button onclick="filterCategory('ALL')" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-blue-600 text-white shadow transition">ALL</button>
        <button onclick="filterCategory(this.innerText)" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">TODAY'S JOBS</button>
        <button onclick="filterCategory(this.innerText)" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">SCHOLARSHIPS</button>
        <button onclick="filterCategory(this.innerText)" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">INTERNSHIPS</button>
        <button onclick="filterCategory(this.innerText)" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">REMOTE JOBS</button>
        <button onclick="filterCategory(this.innerText)" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">FREE COURSES</button>
        <button onclick="filterCategory(this.innerText)" class="cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">COMPETITIONS</button>
    </nav>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="opportunityGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic cards will load here -->
            <div class="col-span-full text-center py-12 text-slate-400">Loading live opportunities...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-12">
        Powered by Python & Gemini AI • Updated Automatically on GitHub Pages
    </footer>

    <script>
        let allOpportunities = [];
        let currentCategory = 'ALL';

        async function loadOpportunities() {
            try {
                const response = await fetch('opportunities.json?' + new Date().getTime());
                allOpportunities = await response.json();
                displayOpportunities(allOpportunities);
            } catch (error) {
                document.getElementById('opportunityGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-500 py-8">Failed to load opportunities data. Please check back shortly.</div>`;
            }
        }

        function displayOpportunities(items) {
            const grid = document.getElementById('opportunityGrid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12">No opportunities found matching your criteria.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <span class="inline-block px-3 py-1 text-xs font-bold text-blue-700 bg-blue-50 rounded-full mb-3">${item.category || 'OPPORTUNITY'}</span>
                        <h3 class="text-lg font-bold text-slate-900 leading-snug mb-2">${item.title}</h3>
                        <p class="text-sm text-slate-600 line-clamp-3 mb-4">${item.description}</p>
                    </div>
                    <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                        class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2.5 px-4 rounded-lg shadow transition">
                        Apply Now &rarr;
                    </a>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            
            // Highlight active button
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === category) {
                    btn.className = "cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-blue-600 text-white shadow transition";
                } else {
                    btn.className = "cat-btn px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition";
                }
            });

            applyFilters();
        }

        function filterOpportunities() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allOpportunities.filter(item => {
                const matchesCategory = currentCategory === 'ALL' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            displayOpportunities(filtered);
        }

        loadOpportunities();
    </script>
</body>
</html>
