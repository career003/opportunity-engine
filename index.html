<script>
        let allOpportunities = [];
        let currentCategory = 'ALL';

        async function loadOpportunities() {
            try {
                const response = await fetch('opportunities.json?' + new Date().getTime());
                allOpportunities = await response.json();
                displayOpportunities(allOpportunities);
            } catch (error) {
                document.getElementById('opportunityGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-500 py-8 bg-white rounded-xl border border-slate-200">Unable to load active listings database. Please check back shortly.</div>`;
            }
        }

        // Helper function to unwrap Google tracking redirect links
        function getCleanUrl(url) {
            if (!url) return '#';
            try {
                if (url.includes('google.com/url?') || url.includes('news.google.com')) {
                    const parsedUrl = new URL(url, window.location.origin);
                    const actualUrl = parsedUrl.searchParams.get('url');
                    if (actualUrl) return actualUrl;
                }
            } catch (e) {
                // Fallback if URL parsing fails
            }
            return url;
        }

        function displayOpportunities(items) {
            const grid = document.getElementById('opportunityGrid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-16 bg-white rounded-xl border border-slate-200">No matching active positions found.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                const cleanLink = getCleanUrl(item.link);
                return `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="px-2.5 py-1 text-[11px] font-bold text-blue-700 bg-blue-50 rounded-md tracking-wide">${item.category || 'OPPORTUNITY'}</span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900 leading-snug mb-2">${item.title}</h3>
                            <p class="text-xs text-slate-600 line-clamp-3 mb-4 leading-relaxed">${item.description}</p>
                            
                            <!-- Timeline Specs -->
                            <div class="text-[11px] text-slate-500 space-y-1 mb-5 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <div><strong>📅 Starting Time:</strong> Immediate / Open Now</div>
                                <div><strong>⏳ End Date:</strong> Rolling / Check Source</div>
                            </div>
                        </div>
                        <a href="${cleanLink}" target="_blank" rel="noopener noreferrer" 
                            class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs py-2.5 px-4 rounded-lg shadow-sm transition">
                            View Details & Apply &rarr;
                        </a>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === category) {
                    btn.className = "cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow transition";
                } else {
                    btn.className = "cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition";
                }
            });
            applyFilters();
        }

        function filterOpportunities() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allOpportunities.filter(item => {
                const matchesCategory = currentCategory === 'ALL' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            displayOpportunities(filtered);
        }

        loadOpportunities();
    </script>
