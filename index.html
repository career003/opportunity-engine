<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Opportunities Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-blue-600 text-white p-6 shadow-md">
        <h1 class="text-3xl font-bold text-center">Opportunity Engine India</h1>
        <p class="text-center text-blue-100 mt-1">Daily Jobs, Scholarships, Internships & Free Courses</p>
    </header>
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <div id="opportunities-list" class="space-y-4">
            <!-- Data will load here automatically -->
            <p class="text-center text-gray-500">Loading today's opportunities...</p>
        </div>
    </main>
    <script>
        fetch('opportunities.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('opportunities-list');
                container.innerHTML = '';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-lg shadow border border-gray-100">
                            <span class="text-xs font-semibold px-2 py-1 bg-blue-100 text-blue-800 rounded">${item.category}</span>
                            <h2 class="text-xl font-bold mt-2">${item.title}</h2>
                            <p class="text-gray-600 mt-1">${item.description}</p>
                            <a href="${item.link}" target="_blank" class="inline-block mt-4 bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700">Apply Now</a>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
