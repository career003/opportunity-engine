name: Run Opportunity Engine Daily

on:
  schedule:
    - cron: '0 3,9,15 * * *' # Runs 3 times a day (UTC time)
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- Add this line to grant write access
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Automation Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add opportunities.json
          git commit -m "Auto-update opportunities" || exit 0
          git push
